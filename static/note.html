<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note - Paradigm</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/nord.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/connection-banner.css">
  <link rel="stylesheet" href="/css/tree.css">
  <link rel="stylesheet" href="/css/breadcrumb.css">
  <link rel="stylesheet" href="/css/topbar.css">
  <link rel="stylesheet" href="/css/prep.css">
  <link rel="stylesheet" href="/css/context-strip.css">
  <link rel="stylesheet" href="/css/navigator.css">
  <link rel="stylesheet" href="/css/markdown.css">
  <link rel="stylesheet" href="/css/hub.css">
  <link rel="stylesheet" href="/css/sheet.css">
  <link rel="stylesheet" href="/css/image-viewer.css">
  <link rel="stylesheet" href="/css/ui.css">
  <script type="module" src="/js/note-main.js"></script>
</head>
<body>
  <!-- The note window: one note at a time, written here. Pages show in the main window. -->
  <div class="app" data-role="note">
    <main class="app__note">
      <header class="topbar">
        <button type="button" class="topbar__nav" aria-controls="navigator" aria-label="Notes" title="Notes">☰</button>
        <nav class="crumbs" aria-label="Where this note is"></nav>
        <button type="button" class="topbar__page topbar__goto" title="The palette: go to a note or a page, or run a command">Go to…</button>
        <button type="button" class="topbar__page topbar__dashboard" title="This note's hub on the dashboard (the main window)">Dashboard ↗</button>
      </header>
      <section class="context-strip" aria-label="Now" hidden></section>
      <div class="hub-line" hidden></div>
      <section class="prep" aria-label="Prep" hidden></section>
      <!-- A meeting's agenda: a second text box over the minutes (hidden on other notes). -->
      <div class="app__agenda" hidden>
        <div class="field-label field-label--agenda" id="agenda-label"></div>
        <pd-editor class="app__agenda-editor" compact aria-labelledby="agenda-label" aria-label="Agenda"></pd-editor>
      </div>
      <div class="field-label field-label--main" id="note-label"></div>
      <pd-editor class="app__editor" aria-label="Note"></pd-editor>
      <!-- The sections slide up over the text from a bar of counts (hubs/section-sheet.js). -->
      <section class="sheet" aria-label="Sections" hidden>
        <section class="hub" aria-label="Sections" hidden></section>
        <button type="button" class="sheet__bar" aria-expanded="false"></button>
      </section>
    </main>
    <div class="navigator__backdrop" hidden></div>
    <nav class="app__sidebar" id="navigator" aria-label="Notes">
      <h1 class="app__title">Paradigm</h1>
      <div class="navigator__pins" role="group" aria-label="Pages"></div>
      <ul class="tree" aria-label="Notes"></ul>
      <footer class="navigator__foot">
        <span class="navigator__save" role="status" title="Whether this note's changes are saved"></span>
      </footer>
    </nav>
  </div>
  <pd-image-viewer></pd-image-viewer>
</body>
</html>
