<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paradigm</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/nord.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/connection-banner.css">
  <link rel="stylesheet" href="/css/tree.css">
  <link rel="stylesheet" href="/css/breadcrumb.css">
  <link rel="stylesheet" href="/css/topbar.css">
  <link rel="stylesheet" href="/css/navigator.css">
  <link rel="stylesheet" href="/css/hub.css">
  <link rel="stylesheet" href="/css/people.css">
  <link rel="stylesheet" href="/css/image-viewer.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <div class="app">
    <!-- The note comes first in the page, so Tab from the editor reaches the tree. -->
    <main class="app__note">
      <header class="topbar">
        <button type="button" class="topbar__nav" aria-controls="navigator" aria-label="Notes" title="Notes (:nav)">☰</button>
        <nav class="crumbs" aria-label="Where this note is"></nav>
        <button type="button" class="topbar__people" title="People (:people)">People</button>
      </header>
      <div class="hub-line" hidden></div>
      <pd-editor class="app__editor" aria-label="Note"></pd-editor>
      <section class="hub" aria-label="Hub sections" hidden></section>
      <section class="people" aria-label="People" hidden></section>
    </main>
    <div class="navigator__backdrop" hidden></div>
    <nav class="app__sidebar" id="navigator" aria-label="Notes">
      <h1 class="app__title">Paradigm</h1>
      <ul class="tree" aria-label="Notes"></ul>
    </nav>
  </div>
  <pd-image-viewer></pd-image-viewer>
</body>
</html>
