<!DOCTYPE html>
<html lang="en" data-theme="nord-light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paradigm</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/themes/nord-light.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/connection-banner.css">
  <link rel="stylesheet" href="/css/tree.css">
  <link rel="stylesheet" href="/css/breadcrumb.css">
  <link rel="stylesheet" href="/css/topbar.css">
  <link rel="stylesheet" href="/css/navigator.css">
  <link rel="stylesheet" href="/css/markdown.css">
  <link rel="stylesheet" href="/css/hub.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/dash-head.css">
  <link rel="stylesheet" href="/css/person-cards.css">
  <link rel="stylesheet" href="/css/gantt.css">
  <link rel="stylesheet" href="/css/list-page.css">
  <link rel="stylesheet" href="/css/today.css">
  <link rel="stylesheet" href="/css/people.css">
  <link rel="stylesheet" href="/css/meetings.css">
  <link rel="stylesheet" href="/css/trash.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/timesheet.css">
  <link rel="stylesheet" href="/css/week.css">
  <link rel="stylesheet" href="/css/oncall.css">
  <link rel="stylesheet" href="/css/plan-template.css">
  <link rel="stylesheet" href="/css/folder-page.css">
  <link rel="stylesheet" href="/css/task-page.css">
  <link rel="stylesheet" href="/css/live.css">
  <link rel="stylesheet" href="/css/image-viewer.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/chip.css">
  <link rel="stylesheet" href="/css/key-hints.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <!-- The main window: dashboards and pages, wide. Notes are written in the note window. -->
  <div class="app" data-role="main">
    <main class="app__note">
      <header class="topbar topbar--main">
        <button type="button" class="topbar__nav" aria-controls="navigator" aria-label="Notes" title="Notes">☰</button>
        <div class="segmented topbar__views" role="group" aria-label="Pages">
          <button type="button" class="segmented__item topbar__today" title="Now, the day, Up next, projects, the Inbox (gt)">Today</button>
          <button type="button" class="segmented__item topbar__week" title="Plan the week; the timesheet (gw)">Week</button>
        </div>
        <nav class="crumbs" aria-label="Where this is"></nav>
        <button type="button" class="topbar__palette" title="Go to a note or a page, or run a command (:)">
          <span class="topbar__palette-text topbar__palette-text--long">Go to a note, page or command…</span>
          <span class="topbar__palette-text topbar__palette-text--short">Go to or run…</span>
          <kbd class="key">:</kbd>
        </button>
        <button type="button" class="topbar__page topbar__window" aria-haspopup="menu" title="Where the note window opens">Window ▾</button>
      </header>
      <header class="dash-head" hidden></header>
      <div class="hub-line" hidden></div>
      <section class="plan-strip" aria-label="Plan" hidden></section>
      <section class="dash-text" aria-labelledby="dash-text-label" hidden>
        <div class="dash-text__head">
          <span class="field-label__name dash-text__label" id="dash-text-label"></span>
          <button type="button" class="dash-text__edit" title="Write it in the note window">Edit ↗</button>
        </div>
        <div class="dash-text__body md-doc"></div>
        <button type="button" class="dash-text__more" hidden>Show more</button>
      </section>
      <!-- Never shown here: the note window edits text. Kept for the app's note session. -->
      <div class="app__editing" hidden>
        <div class="app__agenda" hidden>
          <div class="field-label field-label--agenda" id="agenda-label"></div>
          <pd-editor class="app__agenda-editor" compact aria-label="Agenda"></pd-editor>
        </div>
        <div class="field-label field-label--main" id="note-label"></div>
        <pd-editor class="app__editor" aria-label="Note"></pd-editor>
      </div>
      <section class="hub" aria-label="Sections" hidden></section>
      <section class="home" aria-label="Today" hidden></section>
      <section class="people" aria-label="People" hidden></section>
      <section class="meetings" aria-label="Meetings" hidden></section>
      <section class="trash" aria-label="Trash" hidden></section>
      <section class="week-view" aria-label="Week" tabindex="-1" hidden>
        <header class="week-bar"></header>
        <div class="week-plan cal-view" tabindex="-1">
          <header class="cal-bar"></header>
          <div class="cal">
            <aside class="cal-side" aria-label="Tasks to plan and imported meetings"></aside>
            <section class="cal-week" aria-label="The week"></section>
          </div>
          <footer class="week-foot" aria-label="Time so far"></footer>
        </div>
        <div class="week-time time-view" hidden>
          <header class="time-bar"></header>
          <div class="time-main"></div>
        </div>
        <section class="week-oncall" aria-label="On call" tabindex="-1" hidden></section>
      </section>
      <section class="plan-template-view" aria-label="Plan template" hidden></section>
      <section class="plan-view" aria-label="Plan" hidden></section>
      <section class="folder-view" aria-label="Folder" hidden></section>
      <section class="task-view" aria-label="Task" hidden></section>
      <section class="live-view" aria-label="Live note" hidden></section>
      <div class="status-line" role="status"></div>
    </main>
    <!-- The keys of the view shown (ui/key-hints.js), at the foot of the page. -->
    <footer class="key-hints" aria-label="Keys"></footer>
    <div class="navigator__backdrop" hidden></div>
    <nav class="app__sidebar" id="navigator" aria-label="Notes">
      <h1 class="app__title">Paradigm</h1>
      <div class="navigator__pins" role="group" aria-label="Pages"></div>
      <ul class="tree" aria-label="Notes"></ul>
      <footer class="navigator__foot">
        <button type="button" class="navigator__trash" title="Notes trashed in the last week: restore them from here">Trash</button>
      </footer>
    </nav>
  </div>
  <pd-image-viewer></pd-image-viewer>
</body>
</html>
